<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>RADAR — UI Kit</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #06090F; min-height: 100vh; }
  body { font-family: var(--font-sans); color: var(--fg-1); }
  .stage { min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding: 36px 20px 60px; gap: 20px; }
  .caption { color: var(--fg-3); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 600; }
  .phone-wrap { position: relative; }
  .phone {
    width: 390px; height: 820px; border-radius: 48px;
    background: var(--bg-0);
    position: relative; overflow: hidden;
    box-shadow: 0 40px 100px rgba(0,0,0,0.55), 0 0 0 10px #0e1420, 0 0 0 11px #1f2a3d;
  }
  .notch { position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 32px; border-radius: 20px; background: #000; z-index: 60; }
  .screen { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden;
    padding-top: 40px; }
  .screen::-webkit-scrollbar { display: none; }
  .home-indicator { position: absolute; bottom: 7px; left: 50%; transform: translateX(-50%);
    width: 134px; height: 4px; border-radius: 4px; background: rgba(255,255,255,0.4); z-index: 70; }

  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }

  .screenPicker {
    display: flex; gap: 6px; padding: 6px; border-radius: 14px;
    background: var(--bg-1); border: 1px solid var(--line-2);
  }
  .screenPicker .p {
    padding: 8px 14px; border-radius: 9px; font-size: 12px; font-weight: 600;
    color: var(--fg-3); cursor: pointer;
  }
  .screenPicker .p.active { background: var(--bg-3); color: var(--fg-1); }

  .footer { color: var(--fg-3); font-size: 11px; font-family: var(--font-mono); margin-top: 20px; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="RadarComponents.jsx"></script>
<script type="text/babel" src="RadarScreens.jsx"></script>

<script type="text/babel">
function App() {
  const [screen, setScreen] = React.useState(() => localStorage.getItem('radar.screen') || 'home');
  const [sheet, setSheet] = React.useState(false);

  React.useEffect(() => { localStorage.setItem('radar.screen', screen); }, [screen]);

  const screens = {
    home: <HomeScreen/>,
    list: <ExpensesScreen/>,
    groups: <GroupsScreen/>,
    profile: <ProfileScreen/>,
  };
  const labels = { home: 'Inicio', list: 'Gastos', groups: 'Grupos', profile: 'Perfil' };

  return (
    <div className="stage" data-screen-label="RADAR UI Kit">
      <div className="caption">RADAR · UI Kit · Mobile · Dark</div>

      <div className="screenPicker">
        {Object.keys(labels).map(k => (
          <div key={k} className={'p ' + (screen === k ? 'active' : '')}
            onClick={() => setScreen(k)}>{labels[k]}</div>
        ))}
      </div>

      <div className="phone-wrap">
        <div className="phone">
          <div className="notch"/>
          <StatusBar/>
          <div className="screen" style={{ paddingTop: 38 }}>
            {screens[screen]}
          </div>
          <TabBar active={screen} onChange={setScreen} onFab={() => setSheet(true)}/>
          {sheet && <AddExpenseSheet onClose={() => setSheet(false)} onSave={() => setSheet(false)}/>}
          <div className="home-indicator"/>
        </div>
      </div>

      <div className="footer">Tap “+” to open new expense sheet · Tabs switch screens</div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
