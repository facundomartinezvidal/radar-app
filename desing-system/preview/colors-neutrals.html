<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .preview { padding: 22px 24px; gap: 14px; }
  .hdr { display: flex; align-items: baseline; justify-content: space-between; }
  .hdr .ttl { font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--fg-2); }
  .hdr .sub { font-size: 12px; color: var(--fg-3); font-family: var(--font-mono); }
  .stack { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; flex: 1; }
  .layer { border-radius: 12px; border: 1px solid var(--line-1); display: flex; flex-direction: column; justify-content: space-between; padding: 10px 12px; min-height: 110px; position: relative; }
  .layer .tag { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); }
  .layer .hex { font-family: var(--font-mono); font-size: 11px; color: var(--fg-1); font-weight: 600; }
  .fg-row { display: flex; gap: 16px; padding-top: 6px; }
  .fg-row .fg { font-size: 12px; font-weight: 600; }
</style>
</head><body>
<div class="preview">
  <div class="hdr"><div class="ttl">Neutrals — dark-first surfaces</div><div class="sub">bg-0 → bg-4</div></div>
  <div class="stack">
    <div class="layer" style="background:#0A0F1A"><div class="tag">bg-0 / app</div><div class="hex">#0A0F1A</div></div>
    <div class="layer" style="background:#0F1724"><div class="tag">bg-1 / card</div><div class="hex">#0F1724</div></div>
    <div class="layer" style="background:#17202F"><div class="tag">bg-2 / raised</div><div class="hex">#17202F</div></div>
    <div class="layer" style="background:#1F2A3D"><div class="tag">bg-3 / hover</div><div class="hex">#1F2A3D</div></div>
    <div class="layer" style="background:#2B3A54"><div class="tag">bg-4 / outline</div><div class="hex">#2B3A54</div></div>
  </div>
  <div class="fg-row">
    <div class="fg" style="color:#F4F7FB">fg-1 · high</div>
    <div class="fg" style="color:#B8C3D4">fg-2 · secondary</div>
    <div class="fg" style="color:#7E8AA0">fg-3 · caption</div>
    <div class="fg" style="color:#4B566B">fg-4 · disabled</div>
  </div>
</div>
</body></html>
