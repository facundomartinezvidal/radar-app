<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .preview { justify-content: space-between; padding: 22px 24px; }
  .scale { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; }
  .scale .sw { aspect-ratio: 1 / 1.1; border-radius: 10px; display: flex; flex-direction: column; justify-content: flex-end; padding: 6px 8px; border: 1px solid var(--line-1); }
  .scale .sw .n { font-size: 10px; font-weight: 600; color: rgba(255,255,255,0.85); font-family: var(--font-mono); }
  .scale .sw.light .n { color: rgba(0,0,0,0.6); }
  .hdr { display: flex; align-items: baseline; justify-content: space-between; }
  .hdr .ttl { font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--fg-2); }
  .hdr .sub { font-size: 12px; color: var(--fg-3); font-family: var(--font-mono); }
  .primary-hero { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 14px; background: var(--bg-1); border: 1px solid var(--line-1); }
  .primary-hero .big { width: 56px; height: 56px; border-radius: 12px; background: var(--radar-500); box-shadow: 0 0 0 1px rgba(0,119,182,0.5), 0 8px 24px rgba(0,119,182,0.35); }
  .primary-hero .meta .h { font-weight: 700; font-size: 15px; }
  .primary-hero .meta .c { font-family: var(--font-mono); font-size: 12px; color: var(--fg-3); }
</style>
</head><body>
<div class="preview">
  <div class="hdr"><div class="ttl">Radar Blue — brand</div><div class="sub">primary: 500</div></div>
  <div class="primary-hero">
    <div class="big"></div>
    <div class="meta">
      <div class="h">#0077B6 · Ocean Blue</div>
      <div class="c">oklch(54% .12 237)</div>
    </div>
  </div>
  <div class="scale" id="scale"></div>
</div>
<script>
  const steps = [
    ['50', '#E6F3FA', true], ['100','#C0E1F2', true], ['200','#8ACCE9', true],
    ['300','#4FB3DC', false], ['400','#1E99CC', false], ['500','#0077B6', false],
    ['600','#005F94', false], ['700','#004872', false], ['800','#003352', false], ['900','#001F35', false]
  ];
  document.getElementById('scale').innerHTML = steps.map(([n,c,l]) =>
    `<div class="sw ${l?'light':''}" style="background:${c}"><div class="n">${n}</div></div>`
  ).join('');
</script>
</body></html>
