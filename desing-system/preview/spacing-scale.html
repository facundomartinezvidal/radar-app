<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .preview { padding: 22px 24px; gap: 14px; justify-content: center; }
  .hdr { display: flex; align-items: baseline; justify-content: space-between; }
  .hdr .ttl { font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--fg-2); }
  .hdr .sub { font-size: 12px; color: var(--fg-3); font-family: var(--font-mono); }
  .grid { display: grid; grid-template-columns: repeat(10,1fr); gap: 10px; align-items: end; }
  .step { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .bar { width: 100%; background: linear-gradient(180deg, #1E99CC, #0077B6); border-radius: 4px; }
  .num { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); }
  .label { font-size: 10px; color: var(--fg-2); font-weight: 600; }
</style>
</head><body>
<div class="preview">
  <div class="hdr"><div class="ttl">Spacing scale — 4px base</div><div class="sub">--s-1 … --s-10</div></div>
  <div class="grid" id="g"></div>
</div>
<script>
  const s = [['s-1',4],['s-2',8],['s-3',12],['s-4',16],['s-5',20],['s-6',24],['s-7',32],['s-8',40],['s-9',56],['s-10',72]];
  document.getElementById('g').innerHTML = s.map(([n,v]) =>
    `<div class="step"><div class="bar" style="height:${v}px"></div><div class="label">${n}</div><div class="num">${v}</div></div>`
  ).join('');
</script>
</body></html>
