<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .preview { padding: 22px 24px; gap: 14px; justify-content: center; }
  .hdr { display: flex; align-items: baseline; justify-content: space-between; }
  .hdr .ttl { font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--fg-2); }
  .hdr .sub { font-size: 12px; color: var(--fg-3); font-family: var(--font-mono); }
  .brand { display: flex; gap: 20px; align-items: center; background: var(--bg-1); border: 1px solid var(--line-1); border-radius: 20px; padding: 16px 18px; }
  .brand img { height: 64px; display: block; }
  .txt .h { font-family: 'Inter'; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
  .txt .t { font-size: 12px; color: var(--fg-3); margin-top: 2px; }
  .taglines { display: flex; flex-direction: column; gap: 4px; }
  .tag { font-size: 13px; color: var(--fg-2); }
  .tag.em { font-weight: 600; color: var(--fg-1); font-size: 14px; }
</style>
</head><body>
<div class="preview">
  <div class="hdr"><div class="ttl">Logo &amp; wordmark</div><div class="sub">mark + "RADAR" · Inter 800</div></div>
  <div class="brand">
    <img src="../assets/logo-mark.svg" alt="RADAR mark">
    <div class="txt">
      <div class="h">RADAR</div>
      <div class="t">Sweep · blip · center dot</div>
    </div>
    <div class="taglines" style="margin-left:auto">
      <div class="tag em">RADAR. Sabé a dónde va tu plata.</div>
      <div class="tag">Gestor de gastos para jóvenes adultos.</div>
    </div>
  </div>
</div>
</body></html>
