<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .preview { padding: 22px 24px; gap: 18px; justify-content: center; }
  .hdr { display: flex; align-items: baseline; justify-content: space-between; }
  .hdr .ttl { font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--fg-2); }
  .hdr .sub { font-size: 12px; color: var(--fg-3); font-family: var(--font-mono); }
  .famrow { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .fam { padding: 14px 16px; border: 1px solid var(--line-1); border-radius: 14px; background: var(--bg-1); }
  .fam .name { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 6px; }
  .fam .spec { font-size: 28px; font-weight: 700; letter-spacing: -0.01em; color: var(--fg-1); }
  .fam .use { font-size: 12px; color: var(--fg-3); margin-top: 4px; }
  .weights { display: flex; gap: 12px; font-size: 14px; margin-top: 10px; color: var(--fg-2); }
</style>
</head><body>
<div class="preview">
  <div class="hdr"><div class="ttl">Type families</div><div class="sub">Inter · JetBrains Mono</div></div>
  <div class="famrow">
    <div class="fam" style="font-family:'Inter',sans-serif">
      <div class="name">Sans · UI</div>
      <div class="spec">Inter</div>
      <div class="use">UI, copy, montos (tabular-nums on)</div>
      <div class="weights">
        <span style="font-weight:400">400</span>
        <span style="font-weight:500">500</span>
        <span style="font-weight:600">600</span>
        <span style="font-weight:700">700</span>
      </div>
    </div>
    <div class="fam" style="font-family:'JetBrains Mono',monospace">
      <div class="name">Mono · input</div>
      <div class="spec">JetBrains</div>
      <div class="use" style="font-family:'Inter'">Monto keypad, alias CBU, code</div>
      <div class="weights">
        <span style="font-weight:400">400</span>
        <span style="font-weight:500">500</span>
      </div>
    </div>
  </div>
</div>
</body></html>
