<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .preview { padding: 22px 24px; gap: 14px; justify-content: center; }
  .hdr { display: flex; align-items: baseline; justify-content: space-between; }
  .hdr .ttl { font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--fg-2); }
  .hdr .sub { font-size: 12px; color: var(--fg-3); font-family: var(--font-mono); }
  .row { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; background: var(--bg-1); border: 1px solid var(--line-1); border-radius: 14px; padding: 12px 14px; }
  .av { width: 40px; height: 40px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 14px; }
  .g { display: flex; align-items: center; }
  .g .av { margin-left: -10px; border: 2px solid var(--bg-1); }
  .g .av:first-child { margin-left: 0; }
  .name { font-weight: 600; font-size: 14px; color: var(--fg-1); }
  .meta { font-size: 11px; color: var(--fg-3); }
  .amt { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 14px; }
</style>
</head><body>
<div class="preview">
  <div class="hdr"><div class="ttl">Avatars — hash-colored initials</div><div class="sub">8-hue palette · no photos</div></div>
  <div class="row">
    <div class="av" style="background:#0077B6">FM</div>
    <div><div class="name">Facundo Martínez</div><div class="meta">Pagó alquiler · Hace 1h</div></div>
    <div class="amt" style="color:#34D399">+$ 180.000</div>
  </div>
  <div class="row">
    <div class="g">
      <div class="av" style="background:#0077B6">FM</div>
      <div class="av" style="background:#8B5CF6">JM</div>
      <div class="av" style="background:#F59E0B">IM</div>
      <div class="av" style="background:var(--bg-3); color:var(--fg-2); font-size:11px">+2</div>
    </div>
    <div><div class="name">Grupo "Roommates"</div><div class="meta">5 personas · 3 gastos pendientes</div></div>
    <div class="amt" style="color:#F87171">−$ 24.800</div>
  </div>
</div>
</body></html>
