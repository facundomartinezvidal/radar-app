<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .preview { padding: 22px 24px; gap: 14px; justify-content: center; }
  .hdr { display: flex; align-items: baseline; justify-content: space-between; }
  .hdr .ttl { font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--fg-2); }
  .hdr .sub { font-size: 12px; color: var(--fg-3); font-family: var(--font-mono); }
  .hero { background: var(--bg-1); border: 1px solid var(--line-1); border-radius: 16px; padding: 20px 24px; }
  .hero .lbl { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-3); }
  .hero .amount { font-size: 48px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; color: var(--fg-1); line-height: 1.05; margin-top: 4px; }
  .hero .amount .cents { color: var(--fg-3); font-weight: 500; }
  .hero .amount .cur { color: var(--fg-3); font-weight: 500; margin-right: 8px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .chip { background: var(--bg-1); border: 1px solid var(--line-1); border-radius: 14px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: baseline; }
  .chip .n { font-size: 12px; color: var(--fg-3); }
  .chip .v { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .pos { color: #34D399; }
  .neg { color: #F87171; }
</style>
</head><body>
<div class="preview">
  <div class="hdr"><div class="ttl">Numerals — tabular, tight, decisive</div><div class="sub">font-variant-numeric: tabular-nums</div></div>
  <div class="hero">
    <div class="lbl">Saldo total</div>
    <div class="amount"><span class="cur">$</span>248.500<span class="cents">,00</span></div>
  </div>
  <div class="row">
    <div class="chip"><span class="n">Te deben</span><span class="v pos">+ $ 12.800</span></div>
    <div class="chip"><span class="n">Debés</span><span class="v neg">− $ 4.200</span></div>
  </div>
</div>
</body></html>
