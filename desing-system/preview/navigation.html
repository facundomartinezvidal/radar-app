<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .preview { padding: 22px 24px; gap: 14px; justify-content: center; }
  .hdr { display: flex; align-items: baseline; justify-content: space-between; }
  .hdr .ttl { font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--fg-2); }
  .hdr .sub { font-size: 12px; color: var(--fg-3); font-family: var(--font-mono); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .tab { background: rgba(15,23,36,0.72); backdrop-filter: blur(20px); border: 1px solid var(--line-2); border-radius: 20px; padding: 10px 8px; display: grid; grid-template-columns: repeat(5,1fr); gap: 4px; }
  .it { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; font-size: 10px; color: var(--fg-3); font-weight: 500; }
  .it.active { color: #4FB3DC; }
  .it svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .fab-card { background: var(--bg-1); border: 1px solid var(--line-1); border-radius: 20px; padding: 16px; display: flex; align-items: center; justify-content: center; }
  .fab { width: 56px; height: 56px; border-radius: 999px; background: #0077B6; display: flex; align-items: center; justify-content: center; color: white; box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 10px 30px rgba(0,119,182,0.5); }
  .fab svg { width: 24px; height: 24px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head><body>
<div class="preview">
  <div class="hdr"><div class="ttl">Nav — tab bar &amp; FAB</div><div class="sub">Lucide, 1.5 stroke · blur 20</div></div>
  <div class="grid">
    <div class="tab">
      <div class="it active"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Inicio</div>
      <div class="it"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/></svg>Gastos</div>
      <div class="it"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></div>
      <div class="it"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="8" r="3"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5"/></svg>Grupos</div>
      <div class="it"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>Perfil</div>
    </div>
    <div class="fab-card">
      <div class="fab"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div>
    </div>
  </div>
</div>
</body></html>
