<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .preview { padding: 20px 24px; gap: 4px; justify-content: center; }
  .row { display: flex; align-items: baseline; gap: 14px; padding: 6px 0; border-bottom: 1px solid var(--line-1); }
  .row:last-child { border-bottom: none; }
  .tag { width: 96px; font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); }
  .sample { color: var(--fg-1); font-family: var(--font-sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); white-space: nowrap; }
</style>
</head><body>
<div class="preview">
  <div class="row">
    <div class="tag">display</div>
    <div class="sample" style="font-size:40px; font-weight:700; letter-spacing:-0.02em; font-variant-numeric:tabular-nums">$ 248.500,00</div>
    <div class="meta">44 · 700</div>
  </div>
  <div class="row">
    <div class="tag">h1</div>
    <div class="sample" style="font-size:28px; font-weight:700; letter-spacing:-0.015em">Tus gastos</div>
    <div class="meta">32 · 700</div>
  </div>
  <div class="row">
    <div class="tag">h2</div>
    <div class="sample" style="font-size:22px; font-weight:600; letter-spacing:-0.01em">Resumen de abril</div>
    <div class="meta">24 · 600</div>
  </div>
  <div class="row">
    <div class="tag">h3</div>
    <div class="sample" style="font-size:18px; font-weight:600">Gastos del viernes</div>
    <div class="meta">20 · 600</div>
  </div>
  <div class="row">
    <div class="tag">body</div>
    <div class="sample" style="font-size:15px; color:var(--fg-2)">Registrá un gasto en segundos, sin importar la billetera.</div>
    <div class="meta">16 · 400</div>
  </div>
  <div class="row">
    <div class="tag">caption</div>
    <div class="sample" style="font-size:12px; color:var(--fg-3)">Hace 3 minutos · Mercado Pago</div>
    <div class="meta">12 · 400</div>
  </div>
</div>
</body></html>
